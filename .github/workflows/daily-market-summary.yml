name: Daily Market Summary

on:
  schedule:
    # KST 10:00 = UTC 01:00
    - cron: "0 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate HTML report
        run: python scripts/generate_daily_market_summary.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-market-summary
          path: reports/daily/*.html

      - name: Commit report to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/daily/*.html
          git diff --cached --quiet || git commit -m "chore: add daily market summary report"
          git push
